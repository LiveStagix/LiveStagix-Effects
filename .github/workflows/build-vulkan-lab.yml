name: Build Vulkan Lab APK and AAB

on:
  push:
    branches:
      - main
      - renderer-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK, optimized AAB and benchmark tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y glslc

      - name: Compile Vulkan shaders
        run: |
          mkdir -p renderer/src/main/assets/shaders
          glslc --target-env=vulkan1.0 renderer/src/main/shaders/triangle.vert -o renderer/src/main/assets/shaders/triangle.vert.spv
          glslc --target-env=vulkan1.0 renderer/src/main/shaders/triangle.frag -o renderer/src/main/assets/shaders/triangle.frag.spv
          glslc --target-env=vulkan1.0 renderer/src/main/shaders/vortex.vert -o renderer/src/main/assets/shaders/vortex.vert.spv
          glslc --target-env=vulkan1.0 renderer/src/main/shaders/vortex.frag -o renderer/src/main/assets/shaders/vortex.frag.spv
          test -s renderer/src/main/assets/shaders/triangle.vert.spv
          test -s renderer/src/main/assets/shaders/triangle.frag.spv
          test -s renderer/src/main/assets/shaders/vortex.vert.spv
          test -s renderer/src/main/assets/shaders/vortex.frag.spv

      - name: Install Android build components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Prepare Vulkan Lab signing key
        env:
          VULKAN_LAB_KEYSTORE_BASE64: ${{ secrets.VULKAN_LAB_KEYSTORE_BASE64 }}
          VULKAN_LAB_KEYSTORE_PASSWORD: ${{ secrets.VULKAN_LAB_KEYSTORE_PASSWORD }}
          VULKAN_LAB_KEY_ALIAS: ${{ secrets.VULKAN_LAB_KEY_ALIAS }}
          VULKAN_LAB_KEY_PASSWORD: ${{ secrets.VULKAN_LAB_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$VULKAN_LAB_KEYSTORE_BASE64"
          test -n "$VULKAN_LAB_KEYSTORE_PASSWORD"
          test -n "$VULKAN_LAB_KEY_ALIAS"
          test -n "$VULKAN_LAB_KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/livestagix-vulkan-lab.jks"
          printf '%s' "$VULKAN_LAB_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$VULKAN_LAB_KEYSTORE_PASSWORD" \
            -alias "$VULKAN_LAB_KEY_ALIAS" > /dev/null

          printf 'VULKAN_LAB_KEYSTORE_FILE=%s\\n' "$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build debug APK, optimized release bundle and benchmark tests
        env:
          VULKAN_LAB_KEYSTORE_PASSWORD: ${{ secrets.VULKAN_LAB_KEYSTORE_PASSWORD }}
          VULKAN_LAB_KEY_ALIAS: ${{ secrets.VULKAN_LAB_KEY_ALIAS }}
          VULKAN_LAB_KEY_PASSWORD: ${{ secrets.VULKAN_LAB_KEY_PASSWORD }}
        run: gradle --no-daemon assembleDebug assembleRelease bundleRelease :macrobenchmark:assemble

      - name: Verify APK, AAB and R8 outputs
        run: |
          set -euo pipefail

          DEBUG_APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK_PATH="app/build/outputs/apk/release/app-release.apk"
          AAB_PATH="app/build/outputs/bundle/release/app-release.aab"
          MAPPING_PATH="app/build/outputs/mapping/release/mapping.txt"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          AAPT="${ANDROID_HOME}/build-tools/36.0.0/aapt"
          EXPECTED_CERT_SHA256="e62ef322c3199fe3518ba714287c51830a6f1b7fd704a37fbf6e5dedd86bd5a5"

          test -s "$DEBUG_APK_PATH"
          test -s "$RELEASE_APK_PATH"
          test -s "$AAB_PATH"
          test -s "$MAPPING_PATH"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          echo "Release package and version:"
          RELEASE_BADGING="$("$AAPT" dump badging "$RELEASE_APK_PATH")"
          printf '%s\\n' "$RELEASE_BADGING" | grep -m1 "^package:"

          if printf '%s\\n' "$RELEASE_BADGING" | grep -q "application-debuggable"; then
            echo "ERROR: Release APK is marked debuggable."
            exit 1
          fi
          echo "Release APK debuggable flag: false"

          verify_apk_certificate() {
            local apk_path="$1"
            local cert_output
            local actual_cert_sha256

            "$APKSIGNER" verify "$apk_path"
            cert_output="$("$APKSIGNER" verify --print-certs "$apk_path")"
            printf '%s\\n' "$cert_output"
            actual_cert_sha256="$(printf '%s\\n' "$cert_output" | awk '/Signer #1 certificate SHA-256 digest:/ { gsub(\":\", \"\", $NF); print tolower($NF); exit }')"

            if [ "$actual_cert_sha256" != "$EXPECTED_CERT_SHA256" ]; then
              echo "ERROR: $apk_path was not signed with the dedicated Vulkan Lab certificate."
              exit 1
            fi
          }

          echo "Debug APK signing certificate:"
          verify_apk_certificate "$DEBUG_APK_PATH"

          echo "Release APK signing certificate:"
          verify_apk_certificate "$RELEASE_APK_PATH"

          echo "Release AAB signature:"
          jarsigner -verify "$AAB_PATH" > /dev/null
          AAB_CERT_OUTPUT="$(keytool -printcert -jarfile "$AAB_PATH")"
          printf '%s\\n' "$AAB_CERT_OUTPUT"
          ACTUAL_AAB_CERT_SHA256="$(printf '%s\\n' "$AAB_CERT_OUTPUT" | awk '/SHA256:/ { gsub(\":\", \"\", $2); print tolower($2); exit }')"

          if [ "$ACTUAL_AAB_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "ERROR: AAB was not signed with the dedicated Vulkan Lab certificate."
            exit 1
          fi

          echo "Release AAB SHA-256:"
          sha256sum "$AAB_PATH"

          echo "R8 mapping file:"
          ls -lh "$MAPPING_PATH"

          echo "Macrobenchmark test APKs:"
          find macrobenchmark/build/outputs/apk -type f -name "*.apk" -print -exec ls -lh {} ;

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-lab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload optimized release AAB and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-lab-release-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Macrobenchmark test APK
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-lab-macrobenchmark-test-apk
          path: macrobenchmark/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

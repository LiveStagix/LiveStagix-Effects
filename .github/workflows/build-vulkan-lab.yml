name: Build Vulkan Lab APK

on:
  push:
    branches:
      - main
      - renderer-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install shader compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y glslc

      - name: Compile Vulkan shaders
        run: |
          mkdir -p renderer/src/main/assets/shaders
          glslc --target-env=vulkan1.0 renderer/src/main/shaders/triangle.vert -o renderer/src/main/assets/shaders/triangle.vert.spv
          glslc --target-env=vulkan1.0 renderer/src/main/shaders/triangle.frag -o renderer/src/main/assets/shaders/triangle.frag.spv
          glslc --target-env=vulkan1.0 renderer/src/main/shaders/vortex.vert -o renderer/src/main/assets/shaders/vortex.vert.spv
          glslc --target-env=vulkan1.0 renderer/src/main/shaders/vortex.frag -o renderer/src/main/assets/shaders/vortex.frag.spv
          test -s renderer/src/main/assets/shaders/triangle.vert.spv
          test -s renderer/src/main/assets/shaders/triangle.frag.spv
          test -s renderer/src/main/assets/shaders/vortex.vert.spv
          test -s renderer/src/main/assets/shaders/vortex.frag.spv

      - name: Install Android build components
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Report APK and signing fingerprints
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"

          test -s "$APK_PATH"
          test -x "$APKSIGNER"

          echo "APK SHA-256:"
          sha256sum "$APK_PATH"

          echo "Signing certificate fingerprints:"
          "$APKSIGNER" verify --print-certs "$APK_PATH"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-lab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
